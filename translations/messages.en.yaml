app:
    name: Croche
    tagline: Write your pieces, hear them, print them.

# Read once, when Croche is added to the home screen: name goes on the install
# sheet, short_name under the icon, where iPadOS truncates past ~12 characters.
manifest:
    name: Croche — writing music
    short_name: Croche
    description: A music notebook for writing pieces, listening to them and printing them.

