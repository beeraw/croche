    home: Back to the start
    my_scores: My pieces
    profiles: Profiles
    scores: Scores
    sign_out: Sign out
    admin_area: Admin area
    language: Language

home:
    title: 'Croche — writing music when you are eight'
    lead: >-
        Croche is a small app for writing music. It was built for a child who
        plays the piano, already reads simple sheet music, and wanted to
        compose her own pieces without losing them.
    enter: Enter
    what_title: What it does
    what_score: A full piano staff, treble and bass, like a real music notebook.
    what_input: Notes placed with a finger, on an on-screen piano or straight onto the staff.
    what_listen: Playback of both hands at once, with a cursor that follows the music.
    what_save: Saving that happens on its own, with no button to remember.
    what_print: Clean printing, to turn a piece into real sheet music on paper.
    not_title: What it is not
    not_body: >-
        This is not a professional score editor, and it does not try to be. No
        dynamics, no slurs, no lyrics. Just enough to write a melody and an
        accompaniment, hear them, and keep them.
    install_title: Put it on the home screen
    install_body: >-
        On the iPad, the share button offers "Add to Home Screen". Croche then
        opens like an app, with no address bar and no tabs: the piano keyboard
        gains that much height. An app launched from the icon keeps its own
        cookies, apart from Safari's — so the code has to be tapped in once
        more, and then the session holds.
    offline_title: Nothing leaves this page
    offline_body: >-
        No outbound requests at all: no CDN, no remote font, no downloaded
        sound. The fonts, the icons and the piano tone are all embedded or
        computed on the spot. Once the page is open, the app talks to nobody.
    self_host_title: Run your own
    self_host_body: >-
        Croche is not an online service. There is no sign-up, and this address
        is only one family's instance. The code is on GitHub: take it, install
        it on your own server, and the app becomes yours — your profiles, your
        pieces, your database, at home.
    source_title: Source code
    source_body: >-
        Croche is free software, released under the MIT licence. The README
        explains how to install it.
    source_link: View the project on GitHub

