app:
    name: Croche
    tagline: Escreve as tuas peças, ouve-as, imprime-as.

# Read once, when Croche is added to the home screen: name goes on the install
# sheet, short_name under the icon, where iPadOS truncates past ~12 characters.
manifest:
    name: Croche — escrever música
    short_name: Croche
    description: Um caderno de música para escrever peças, ouvi-las e imprimi-las.

nav:
    home: Voltar ao início
    my_scores: As minhas peças
    profiles: Perfis
    scores: Partituras
    sign_out: Terminar sessão
    admin_area: Área de administração
    language: Idioma

home:
    title: 'Croche — escrever música aos oito anos'
    lead: >-
        Croche é uma pequena aplicação para escrever música. Nasceu para uma
        criança que toca piano, já lê partituras simples e queria compor as suas
        próprias peças sem as perder.
    enter: Entrar
    what_title: O que sabe fazer
    what_score: Uma pauta de piano completa, clave de sol e clave de fá, como num caderno de música a sério.
    what_input: Notas colocadas com o dedo, num piano no ecrã ou diretamente na pauta.
    what_listen: A audição das duas mãos ao mesmo tempo, com um cursor que segue a música.
    what_save: Uma gravação que acontece sozinha, sem botão nenhum para lembrar.
    what_print: Uma impressão limpa, para transformar a peça numa partitura de papel a sério.
    not_title: O que não é
    not_body: >-
        Não é um editor de partituras profissional, e não tenta ser. Sem
        dinâmicas, sem ligaduras, sem letra. Apenas o suficiente para escrever
        uma melodia e um acompanhamento, ouvi-los e guardá-los.
    install_title: Põe-na no ecrã principal
    install_body: >-
        No iPad, o botão de partilha oferece «Adicionar ao ecrã principal».
        Croche abre então como uma aplicação, sem barra de endereço nem
        separadores: o teclado de piano ganha essa altura. Uma aplicação aberta
        a partir do ícone tem os seus próprios cookies, separados dos do Safari
        — por isso o código tem de ser escrito mais uma vez, e depois a sessão
        aguenta.
    offline_title: Nada sai desta página
    offline_body: >-
        Nenhum pedido para o exterior: sem CDN, sem tipo de letra remoto, sem
        som descarregado. Os tipos de letra, os ícones e o timbre do piano estão
        todos embutidos ou são calculados na hora. Depois de a página abrir, a
        aplicação não fala com ninguém.
    self_host_title: Instalar em casa
    self_host_body: >-
        Croche não é um serviço online. Não há registo, e este endereço é apenas
        a instância de uma família. O código está no GitHub: descarrega-o,
        instala-o no teu próprio servidor e a aplicação passa a ser tua — os
        teus perfis, as tuas peças, a tua base de dados, em casa.
    source_title: Código-fonte
    source_body: >-
        Croche é software livre, publicado sob a licença MIT. O README explica
        como instalá-lo.
    source_link: Ver o projeto no GitHub

