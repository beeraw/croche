note_name:
    c: C
    d: D
    e: E
    f: F
    g: G
    a: A
    # B natural is called H in German. The app never writes flats, so the other
    # half of that convention — B meaning B flat — never comes up.
    b: H
    # %note% stands for the note itself. A pattern rather than a word to
    # append, because German writes the sharp as one word: Cis, Fis, Ais.
    sharp_pattern: '%note%is'

