home:
    title: 'Croche — Musik schreiben, wenn man acht ist'
    lead: >-
        Croche ist eine kleine App zum Musikschreiben. Sie ist für ein Kind
        entstanden, das Klavier spielt, einfache Noten schon lesen kann und
        seine eigenen Stücke schreiben wollte, ohne sie zu verlieren.
    enter: Los geht's
    what_title: Was sie kann
    what_score: Ein ganzes Klaviersystem, Violin- und Bassschlüssel, wie in einem echten Notenheft.
    what_input: Noten mit dem Finger gesetzt, auf einem Klavier am Bildschirm oder direkt in die Notenzeile.
    what_listen: Beide Hände gleichzeitig hören, mit einem Strich, der der Musik folgt.
    what_save: Ein Speichern, das von allein passiert, ohne Knopf, an den man denken muss.
    what_print: Ein sauberer Ausdruck, damit aus dem Stück echte Noten auf Papier werden.
    not_title: Was sie nicht ist
    not_body: >-
        Sie ist kein professioneller Notensatz und will auch keiner sein. Keine
        Dynamik, keine Bögen, kein Text. Gerade genug, um eine Melodie und eine
        Begleitung zu schreiben, sie zu hören und zu behalten.
    offline_title: Nichts verlässt diese Seite
    offline_body: >-
        Überhaupt keine Anfragen nach außen: kein CDN, keine Schrift von
        anderswo, kein heruntergeladener Klang. Schriften, Symbole und der
        Klavierklang sind eingebettet oder werden an Ort und Stelle berechnet.
        Ist die Seite einmal offen, spricht die App mit niemandem.
    self_host_title: Selbst betreiben
    self_host_body: >-
        Croche ist kein Onlinedienst. Es gibt keine Anmeldung, und diese Adresse
        ist nur die Instanz einer Familie. Der Code liegt auf GitHub: nimm ihn,
        installiere ihn auf deinem eigenen Server, und die App gehört dir —
        deine Profile, deine Stücke, deine Datenbank, zu Hause.
    source_title: Quellcode
    source_body: >-
        Croche ist freie Software unter der MIT-Lizenz. Die README erklärt, wie
        man sie installiert.
    source_link: Das Projekt auf GitHub ansehen

