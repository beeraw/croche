app:
    name: Croche
    tagline: Écris tes morceaux, écoute-les, imprime-les.

# Read once, when Croche is added to the home screen: name goes on the install
# sheet, short_name under the icon, where iPadOS truncates past ~12 characters.
manifest:
    name: Croche — écrire de la musique
    short_name: Croche
    description: Un cahier de musique pour écrire ses morceaux, les écouter et les imprimer.

nav:
    home: Retour à l'accueil
    my_scores: Mes morceaux
    profiles: Profils
