    sign_out: Se déconnecter
    admin_area: Espace administrateur
    language: Langue

home:
    title: 'Croche — écrire de la musique, quand on a huit ans'
    lead: >-
        Croche est une petite application pour écrire de la musique. Elle est
        née pour une enfant qui joue du piano, lit déjà des partitions simples,
        et voulait composer ses propres morceaux sans les perdre.
    enter: Entrer
    what_title: Ce qu'elle sait faire
    what_score: Une grande portée piano, clé de sol et clé de fa, comme dans un vrai cahier de musique.
    what_input: Des notes posées au doigt, sur un clavier de piano à l'écran ou directement sur la portée.
    what_listen: Une écoute des deux mains à la fois, avec un curseur qui suit la musique.
    what_save: Une sauvegarde toute seule, sans bouton à penser à appuyer.
    what_print: Une impression propre, pour transformer le morceau en vraie partition papier.
    not_title: Ce qu'elle n'est pas
    not_body: >-
        Ce n'est pas un éditeur de partition professionnel, et elle n'essaie pas
        de l'être. Pas de nuances, pas de liaisons, pas de paroles. Juste de
        quoi écrire une mélodie et un accompagnement, les entendre, et les
        garder.
    install_title: À poser sur l'écran d'accueil
    install_body: >-
        Sur l'iPad, le bouton de partage propose « Sur l'écran d'accueil ».
        Croche s'ouvre alors comme une application, sans barre d'adresse ni
        onglets : le clavier de piano y gagne de la hauteur. Une application
        lancée depuis l'icône a ses propres cookies, séparés de ceux de Safari
        — le code est donc à ressaisir une fois, puis la session tient.
    offline_title: Rien ne sort d'ici
    offline_body: >-
        Aucune requête vers l'extérieur : pas de CDN, pas de police distante,
        pas de son téléchargé. Les polices, les icônes et le timbre de piano
        sont tous embarqués ou calculés sur place. Une fois la page ouverte,
        l'application ne parle à personne.
    self_host_title: À installer chez soi
    self_host_body: >-
        Croche n'est pas un service en ligne. Il n'y a pas d'inscription, et
        cette adresse n'est que l'instance d'une famille. Le code est sur
        GitHub : on le récupère, on l'installe sur son propre serveur, et
        l'application devient la sienne — ses profils, ses morceaux, sa base de
        données, chez soi.
    source_title: Code source
    source_body: >-
        Croche est un logiciel libre, publié sous licence MIT. Le README
        explique comment l'installer.
    source_link: Voir le projet sur GitHub

