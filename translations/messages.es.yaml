home:
    title: 'Croche — escribir música cuando tienes ocho años'
    lead: >-
        Croche es una pequeña aplicación para escribir música. Nació para una
        niña que toca el piano, ya lee partituras sencillas y quería componer
        sus propias piezas sin perderlas.
    enter: Entrar
    what_title: Lo que sabe hacer
    what_score: Un pentagrama de piano completo, clave de sol y clave de fa, como un cuaderno de música de verdad.
    what_input: Notas puestas con el dedo, en un piano en pantalla o directamente sobre el pentagrama.
    what_listen: La escucha de las dos manos a la vez, con un cursor que sigue la música.
    what_save: Un guardado que ocurre solo, sin ningún botón que recordar.
    what_print: Una impresión limpia, para convertir la pieza en una partitura de papel de verdad.
    not_title: Lo que no es
    not_body: >-
        No es un editor de partituras profesional, y no pretende serlo. Sin
        matices, sin ligaduras, sin letra. Justo lo necesario para escribir una
        melodía y un acompañamiento, oírlos y guardarlos.
    offline_title: Nada sale de esta página
    offline_body: >-
        Ninguna petición hacia fuera: sin CDN, sin tipografía remota, sin sonido
        descargado. Las tipografías, los iconos y el timbre del piano van
        incrustados o se calculan sobre la marcha. Una vez abierta la página, la
        aplicación no habla con nadie.
    self_host_title: Instálala en tu casa
    self_host_body: >-
        Croche no es un servicio en línea. No hay registro, y esta dirección es
        solo la instancia de una familia. El código está en GitHub: descárgalo,
        instálalo en tu propio servidor y la aplicación pasa a ser tuya — tus
        perfiles, tus piezas, tu base de datos, en casa.
    source_title: Código fuente
    source_body: >-
        Croche es software libre, publicado bajo licencia MIT. El README explica
        cómo instalarlo.
    source_link: Ver el proyecto en GitHub

