; Same limits as the PHP-FPM of rossem before the move to Docker (php.ini, 24/10/2026). Croche has no pool of its own.
memory_limit = 512M
upload_max_filesize = 200M
post_max_size = 220M
max_execution_time = 60
date.timezone = Indian/Mayotte
expose_php = Off

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
; In production the code only changes at a release, which restarts the container: no need to stat every file. The
; local setup (deploy/local) turns it back on, the code being edited under the running container.
opcache.validate_timestamps = ${OPCACHE_VALIDATE_TIMESTAMPS}

realpath_cache_size = 4096K
realpath_cache_ttl = 600
