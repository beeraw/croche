framework:
    validation:
        # Constraint messages live alongside the rest of the interface, in the
        # "messages" domain, rather than in a separate "validators" catalogue.
        translation_domain: messages

        # Enables validator auto-mapping support.
        # For instance, basic validation constraints will be inferred from Doctrine's metadata.
        #auto_mapping:
        #    App\Entity\: []

when@test:
    framework:
        validation:
            not_compromised_password: false
