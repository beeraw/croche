security:
    password_hashers:
        # Same hasher for the admin password and for the child's four-digit PIN.
        App\Entity\User:
            algorithm: bcrypt
            cost: 12

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: username

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|_error|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            custom_authenticators:
                - App\Security\AdminFormAuthenticator
                - App\Security\PinCodeAuthenticator
            # Guards the administrator password, which has no throttle of its
            # own. The child's PIN keeps its per-profile lockout as the real
            # defence: PinCodeThrottle locks at the fifth failure and
            # PinCodeAuthenticator refuses locked profiles before this listener
            # ever runs, so the two never contradict each other.
            login_throttling:
                max_attempts: 5
            logout:
                path: security.logout
                target: security.profiles

    # Only the first matching rule applies.
    access_control:
        - { path: '^/$', roles: PUBLIC_ACCESS }
        # Safari reads the manifest when the visitor adds Croche to the home
        # screen, which they may well do before ever signing in.
        - { path: '^/manifest\.webmanifest$', roles: PUBLIC_ACCESS }
        - { path: ^/langue, roles: PUBLIC_ACCESS }
        - { path: ^/connexion, roles: PUBLIC_ACCESS }
        - { path: ^/deconnexion, roles: PUBLIC_ACCESS }
        - { path: ^/profils, roles: PUBLIC_ACCESS }
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            App\Entity\User:
                algorithm: bcrypt
                cost: 4
        firewalls:
            main:
                # The rate limiter lives in the filesystem cache pool, so its
                # counters would outlive a test and bleed into the next one —
                # every case signs in from 127.0.0.1 as the same profile. The
                # PIN lockout under test is PinCodeThrottle's, which is stored
                # on the User row and reset with the schema.
                login_throttling: false
