security:
    password_hashers:
        # Same hasher for the admin password and for the child's four-digit PIN.
        App\Entity\User:
            algorithm: bcrypt
            cost: 12

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: username

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            custom_authenticators:
                - App\Security\AdminFormAuthenticator
                - App\Security\PinCodeAuthenticator
            logout:
                path: security.logout
                target: security.profiles

    # Only the first matching rule applies.
    access_control:
        - { path: '^/$', roles: PUBLIC_ACCESS }
        - { path: ^/langue, roles: PUBLIC_ACCESS }
        - { path: ^/connexion, roles: PUBLIC_ACCESS }
        - { path: ^/deconnexion, roles: PUBLIC_ACCESS }
        - { path: ^/profils, roles: PUBLIC_ACCESS }
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            App\Entity\User:
                algorithm: bcrypt
                cost: 4
